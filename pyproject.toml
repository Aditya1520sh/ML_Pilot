[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mlpilotx"
version = "0.1.1"
description = "MLPilot — Data In, Insights Out. Production-grade AutoML for tabular data."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Aditya Sharma" }
]
keywords = [
    "machine-learning",
    "scikit-learn",
    "tabular-data",
    "pipeline",
    "classification",
    "regression"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "scikit-learn>=1.4",
    "pandas>=2.1",
    "numpy>=1.26",
    "optuna>=3.5",
    "shap>=0.44",
    "typer>=0.12",
    "rich>=13.7",
    "joblib>=1.3",
    "plotly>=5.18",
    "matplotlib>=3.8",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "pyyaml>=6.0",
    "pyarrow>=14.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.2",
]

[project.scripts]
mlpilot = "ml_pilot.cli:app"

# src/ layout: editable installs must put `src` on sys.path
[tool.hatch.build]
dev-mode-dirs = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/ml_pilot"]

[tool.hatch.build.targets.sdist]
include = [
  "src/ml_pilot",
  "configs",
  "examples",
  "README.md",
  "LICENSE",
  "pyproject.toml"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
